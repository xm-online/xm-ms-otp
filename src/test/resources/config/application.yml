# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================


spring:
    application:
        name: otp
    cloud:
        bus:
            enabled: false
        discovery:
            enabled: false
        consul:
            enabled: false
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: jdbc:h2:mem:otp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        name:
        username:
        password:
        hikari:
            auto-commit: false
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        database: H2
        open-in-view: false
        show-sql: false
        hibernate:
            ddl-auto: none
            naming:
                physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
                implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
        properties:
            hibernate.connection.provider_disables_autocommit: true
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: true
            hibernate.hbm2ddl.auto: validate
            hibernate.timezone.default_storage: NORMALIZE
            hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
    liquibase:
        contexts: test
    main:
        allow-bean-definition-overriding: true
    mail:
        host: localhost
    messages:
        basename: i18n/messages
    thymeleaf:
        mode: HTML
    jackson:
        mapper:
            # Jackson 3 sorts properties alphabetically by default; keep the declaration order responses had before
            sort-properties-alphabetically: false
        serialization:
            indent_output: true
        default-property-inclusion: non_null
    h2:
        console:
            enabled: false
server:
    port: 10344
    address: localhost

info:
    project:
        version: #project.version#

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
management:
    health:
        mail:
            enabled: false
    tracing:
        export:
            enabled: false
    otlp:
        metrics:
            export:
                enabled: false
    prometheus:
        metrics:
            export:
                enabled: true

jhipster:
    async:
        core-pool-size: 1
        max-pool-size: 50
        queue-capacity: 10000
    # To test logstash appender
    logging:
        logstash:
            enabled: true
            host: localhost
            port: 5000
            ring-buffer-size: 512
    security:
        content-security-policy: "default-src * data: blob: 'unsafe-inline' 'unsafe-eval'"
        authentication:
            jwt:
                # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
                base64-secret: YzgyNDNkYjM2YzM5NDJiNThkNGI2YWI5NGUzMzE5NGYxMjYzMWVhYzZhNWEwNzliODkzZDYzMmRmNWY4NjYxOWZlZTAyOTAzMTRlMjg5ODg3NjFhNGEyMzNmNDJkMGUzOWE5MWViYTBmNjM2YWRlNDE1NjQ3NjU1YTU0MWQ0Yjg=
                # Token is valid 24 hours
                token-validity-in-seconds: 86400
        client-authorization:
            access-token-uri: http://config/api/token_key
            token-service-id: config
            client-id: internal
            client-secret: internal

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================
xm-config:
    enabled: false

application:
    timeline-ignored-http-methods:
    kafka-system-topic: system_topic
    kafka-system-queue: system_queue
    tenant-ignored-path-list: /swagger-resources/configuration/ui, /management/health, /oauth/token_key, /h2-console, /v3/api-docs
    timelines-enabled: true
    spec-path: /config/tenants/XM/otp/otpspec.yml
    tenant-path: /config/tenants/XM/tenant-config.yml
    lep:
        tenant-script-storage: XM_MS_CONFIG
        lep-resource-path-pattern: /config/tenants/{tenantName}/entity/lep/resources/**/*
